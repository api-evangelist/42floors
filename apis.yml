name: 42Floors
description: >-
  42Floors was a commercial real estate (CRE) search engine that made it easy to
  search for office space, coworking, and commercial listings across major U.S.
  markets. Founded in 2011 and part of Y Combinator's Winter 2012 batch, it was
  backed by Andreessen Horowitz (a16z) and other investors and grew a nationwide
  catalog of hundreds of thousands of listings. The company was acquired by
  flexible-office provider Knotel in July 2018, and later by real estate software
  company Yardi in 2021, which folded the 42Floors listing service into its
  CommercialEdge network of marketplaces (CommercialCafe, CommercialSearch,
  Point2, PropertyShark). 42Floors no longer operates as an independent brand:
  its 42floors.com domain now redirects to commercialcafe.com, and it exposes no
  public developer program, API, or documentation. This profile is retained in
  the API Evangelist network as an a16z portfolio-company lead with no active API
  surface to enrich.
